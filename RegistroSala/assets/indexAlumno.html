<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Inicio de sesión</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="Css/asistencia.css">
</head>
<body>
  <div class="d-flex justify-content-center align-items-center vh-100 bg-light">
    <div class="card p-4 shadow-lg rounded asistencia-box">
      <div class="text-center">
        <img class="logo mb-3" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTuc9Aq8alOIs33kPxaNZTFH9VJ8gF3vIH7oA&s" alt="Logo Universidad del Mar">
        <h2 class="text-primary">Reservar Salas de Cómputo</h2>
        <p class="text-secondary">UNIVERSIDAD DEL MAR</p>
        <h3 class="mb-3">Confirmar asistencia</h3>
      </div>

      <input type="text" id="matricula" class="form-control mb-3" placeholder="Ingrese su matrícula">
      <button onclick="validarMatricula()" class="btn btn-primary w-100">INICIAR SESIÓN</button>
      <div id="horaActual" class="text-end text-muted mt-2"></div>
    </div>
  </div>

  <!-- Modal -->
  <div id="myModal" class="modal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Confirmación</h5>
          <button type="button" class="btn-close" onclick="cerrarModal()"></button>
        </div>
        <div class="modal-body">
          <p id="mensajeBienvenida"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" onclick="cerrarModal()">Aceptar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="Js/Alumnos.js"></script>
  <script src="Js/asistencia.js"></script>
</body>
</html>
