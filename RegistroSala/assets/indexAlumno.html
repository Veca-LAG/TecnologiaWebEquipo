<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Inicio de sesión</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: #2c9dbf;
      font-family: Arial, sans-serif;
    }
    .contenedor {
      max-width: 600px;
      margin: 60px auto;
      padding: 30px;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      text-align: center;
    }
    .logo {
      width: 100px;
      margin-bottom: 15px;
    }
    h2, h3 {
      color: #154c79;
    }
    #horaActual {
      position: absolute;
      top: 10px;
      right: 20px;
      font-weight: bold;
      color: white;
    }
    input {
      padding: 10px;
      width: 80%;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #154c79;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #103c61;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.4);
    }

    .modal-content {
      background-color: #fff;
      margin: 15% auto;
      padding: 25px;
      border-radius: 10px;
      width: 80%;
      max-width: 400px;
      text-align: center;
    }

    .close {
      color: #aaa;
      float: right;
      font-size: 28px;
      font-weight: bold;
    }

    .close:hover,
    .close:focus {
      color: black;
      text-decoration: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="horaActual"></div>
  <div class="contenedor">
    <img class="logo" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTuc9Aq8alOIs33kPxaNZTFH9VJ8gF3vIH7oA&s" alt="Logo Universidad del Mar">
    <h2>Reservar Salas de Cómputo</h2>
    <p>UNIVERSIDAD DEL MAR</p>
    <h3>Confirmar asistencia</h3>
    <input type="text" id="matricula" placeholder="Ingrese su matrícula">
    <br>
    <button onclick="validarMatricula()">INICIAR SESIÓN</button>
  </div>

  <!-- Modal -->
  <div id="myModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="cerrarModal()">&times;</span>
      <p id="mensajeBienvenida"></p>
      <button onclick="cerrarModal()">Aceptar</button>
    </div>
  </div>

  <script src="Js/Alumnos.js"></script>
  <script>
    function mostrarHoraActual() {
      const ahora = new Date();
      document.getElementById("horaActual").innerText = ahora.toLocaleTimeString('es-ES', {
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      });
    }
    mostrarHoraActual();
    setInterval(mostrarHoraActual, 1000);

    function validarMatricula() {
      const input = document.getElementById("matricula").value.trim();
      const alumno = alumnos.find(a => a.matricula === input);

      if (alumno) {
        const ahora = new Date();
        const horaEntrada = ahora.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });

        let reservas = JSON.parse(localStorage.getItem('reservasConfirmadas')) || [];
        const reservasAlumno = reservas.filter(r =>
          r.matricula === input &&
          (!r.horaRealSalida)
        );

        let mensaje = "";

        if (reservasAlumno.length > 0) {
          const reserva = reservasAlumno[0];

          if (!reserva.horaRealEntrada) {
            reserva.horaRealEntrada = horaEntrada;
            reserva.estado = "En uso";
            mensaje = `
              <strong>Bienvenido ${alumno.nombre}</strong><br>
              Hora de entrada: ${horaEntrada}<br>
              Sala: ${reserva.sala}
            `;
          } else {
            reserva.horaRealSalida = horaEntrada;
            reserva.estado = "Finalizado";
            mensaje = `
              <strong>Sesión finalizada ${alumno.nombre}</strong><br>
              Hora de salida: ${horaEntrada}<br>
              ¡Gracias por su visita!
            `;
          }

          localStorage.setItem("reservasConfirmadas", JSON.stringify(reservas));
        } else {
          mensaje = `
            <strong>Bienvenido ${alumno.nombre}</strong><br>
            No tienes reservas activas en este momento.
          `;
        }

        document.getElementById("mensajeBienvenida").innerHTML = mensaje;
        document.getElementById("myModal").style.display = "block";
        localStorage.setItem("alumno", JSON.stringify(alumno));
      } else {
        alert("Matrícula inválida.");
      }
    }

    function cerrarModal() {
      document.getElementById("myModal").style.display = "none";
    }
  </script>
</body>
</html>
